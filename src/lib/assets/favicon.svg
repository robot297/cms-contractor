<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
	<!--
		The tab icon. Same mark as static/icon.svg, with its own corner radius —
		a browser tab masks nothing, where iOS masks a touch icon itself.

		This replaces the framework's default Svelte logo, which had been shipping as
		the app's identity everywhere the icon is shown: the tab, the bookmark, and
		the tile a shared link gets on a phone.
	-->
	<defs>
		<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#2ec9ff" />
			<stop offset="1" stop-color="#8b6cff" />
		</linearGradient>
	</defs>
	<rect width="32" height="32" rx="8" fill="url(#sweep)" />
	<circle
		cx="16"
		cy="16"
		r="8.4"
		fill="none"
		stroke="#04121c"
		stroke-width="3.8"
		stroke-linecap="round"
		stroke-dasharray="37 16"
		transform="rotate(53 16 16)" />
</svg>
