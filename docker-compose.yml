services:
  db:
    image: postgres:16-alpine
    container_name: cms-contractor-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cms_contractor
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cms_contractor']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cms-contractor-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cms_contractor
      ORIGIN: http://localhost:3000
      BETTER_AUTH_SECRET: development-secret-change-me
    ports:
      - '3000:3000'

volumes:
  postgres_data:
