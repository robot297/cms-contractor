<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
	<!--
		Centered on purpose. iMessage (and Slack's compact layout) crop link previews
		toward the middle, so anything parked on an edge gets cut. Everything here
		lives inside roughly the central 800x460, well clear of every edge.

		static/og.png is the rendered copy that og:image actually points at.
		Regenerate after editing this file:
		  python3 -c "import cairosvg; cairosvg.svg2png(url='static/og.svg', \
		    write_to='static/og.png', output_width=1200, output_height=630, \
		    background_color='#0b0d11')"
	-->
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#171a21" />
			<stop offset="1" stop-color="#0b0d11" />
		</linearGradient>
		<radialGradient id="glow" cx="0.5" cy="0.05" r="0.85">
			<stop offset="0" stop-color="#ffcc00" stop-opacity="0.1" />
			<stop offset="0.55" stop-color="#ffcc00" stop-opacity="0.03" />
			<stop offset="1" stop-color="#ffcc00" stop-opacity="0" />
		</radialGradient>
	</defs>

	<rect width="1200" height="630" fill="url(#bg)" />
	<rect width="1200" height="630" fill="url(#glow)" />

	<!-- Brand lockup: wordmark over a short yellow rule -->
	<text
		x="600"
		y="150"
		text-anchor="middle"
		font-size="27"
		font-weight="700"
		fill="#ffffff"
		letter-spacing="7">CONTRACTOR CRM</text>
	<rect x="562" y="178" width="76" height="5" rx="2.5" fill="#ffcc00" />

	<!-- Headline. Second line takes the yellow marker, matching the landing hero. -->
	<text
		x="600"
		y="318"
		text-anchor="middle"
		font-size="64"
		font-weight="800"
		fill="#ffffff">Manage client relationships</text>
	<rect x="432" y="350" width="336" height="84" rx="14" fill="#ffcc00" />
	<text
		x="600"
		y="410"
		text-anchor="middle"
		font-size="64"
		font-weight="800"
		fill="#14171c">with ease.</text>

	<!-- Subhead -->
	<g text-anchor="middle" fill="#c3c9d4" font-size="29" font-weight="400">
		<text x="600" y="506">Simple, powerful contractor enablement.</text>
		<text x="600" y="548">Focus more on your projects and less on the tedium.</text>
	</g>
</svg>
